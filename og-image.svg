<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="423" cy="290" r="36" fill="#1a1a2e" opacity="0.15"/>
    <circle cx="1074" cy="-90" r="23" fill="#1a1a2e" opacity="0.08"/>
    <circle cx="447" cy="146" r="68" fill="#1a1a2e" opacity="0.12"/>
    <circle cx="490" cy="487" r="45" fill="#1a1a2e" opacity="0.06"/>
    <circle cx="980" cy="-33" r="56" fill="#1a1a2e" opacity="0.09"/>
    <circle cx="1087" cy="396" r="97" fill="#1a1a2e" opacity="0.17"/>
    <rect x="452" y="306" width="59" height="84" rx="8" fill="#0a0a0a" opacity="0.09" transform="rotate(33, 364, 574)"/>
    <rect x="1267" y="427" width="56" height="23" rx="8" fill="#0a0a0a" opacity="0.08" transform="rotate(30, 496, 264)"/>
    <rect x="440" y="163" width="37" height="20" rx="8" fill="#0a0a0a" opacity="0.10" transform="rotate(10, 621, 324)"/>
    <rect x="108" y="310" width="51" height="53" rx="8" fill="#0a0a0a" opacity="0.15" transform="rotate(5, 763, 159)"/>
    <rect x="22" y="98" width="80" height="58" rx="8" fill="#0a0a0a" opacity="0.04" transform="rotate(31, 657, 602)"/>
    <rect x="61" y="323" width="97" height="71" rx="8" fill="#0a0a0a" opacity="0.14" transform="rotate(11, 573, 672)"/>
    <rect x="297" y="548" width="70" height="57" rx="8" fill="#0a0a0a" opacity="0.04" transform="rotate(23, 1009, 25)"/>
    <rect x="-24" y="-70" width="81" height="52" rx="8" fill="#0a0a0a" opacity="0.09" transform="rotate(29, 1049, 578)"/>
    <polygon points="403,126 482,284 324,284" fill="#1a1a2e" opacity="0.07"/>
    <polygon points="1219,131 1303,299 1135,299" fill="#1a1a2e" opacity="0.06"/>
    <polygon points="563,227 584,269 542,269" fill="#1a1a2e" opacity="0.09"/>
    <polygon points="280,-35 301,7 259,7" fill="#1a1a2e" opacity="0.06"/>

  <!-- Wave at bottom -->
  <path d="M0,540 C360,585 840,495 1200,540 L1200,630 L0,630Z" fill="#1a1a2e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 홍대입구 럭셔리 셔츠룸 리뷰
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 셔츠룸
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#7c3aed" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 홍대입구 럭셔리 셔츠룸 리뷰 — 셔츠룸
  </text>
</svg>